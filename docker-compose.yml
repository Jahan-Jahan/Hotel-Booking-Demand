services:
  db:
    image: postgres:16
    container_name: hotel-postgres
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: hotel-api
    ports:
      - "8000:8000"

volumes:
  pgdata:
